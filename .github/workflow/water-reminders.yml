name: Water reminders

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Optional test message"
        required: false
        default: "💧 Hydra test reminder — have some water."
  schedule:
    # India Standard Time (Asia/Kolkata). Times are deliberately off the hour
    # because GitHub notes that scheduled workflows can be delayed under load.
    - cron: "7 8 * * *"
      timezone: "Asia/Kolkata"
    - cron: "7 10 * * *"
      timezone: "Asia/Kolkata"
    - cron: "7 12 * * *"
      timezone: "Asia/Kolkata"
    - cron: "7 14 * * *"
      timezone: "Asia/Kolkata"
    - cron: "7 16 * * *"
      timezone: "Asia/Kolkata"
    - cron: "7 18 * * *"
      timezone: "Asia/Kolkata"
    - cron: "7 20 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Hydra notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_MESSAGE: ${{ inputs.message }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "NTFY_TOPIC secret is missing."
            exit 1
          fi

          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            MESSAGE="${TEST_MESSAGE:-💧 Hydra test reminder — have some water.}"
            TITLE="Hydra test"
          else
            MESSAGE="💧 Water check — take a glass of water and log it in Hydra."
            TITLE="Hydra • Hydration reminder"
          fi

          curl --fail --silent --show-error \
            -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
            -H "Title: ${TITLE}" \
            -H "Priority: default" \
            -H "Tags: droplet" \
            --data-raw "${MESSAGE}"
